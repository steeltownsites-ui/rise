name: Build Rise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 2[6-9]" || { echo "No Xcode 26 on this runner"; exit 1; }

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild -project Rise.xcodeproj -target Rise -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Rise.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Rise.app Payload/
          zip -qr Rise.ipa Payload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ matrix.runner }}
          name: Rise build ${{ github.run_number }} (${{ matrix.runner }})
          body: Install Rise.ipa with Sideloadly or SideStore using your Apple ID.
          files: Rise.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log
